name: hidayat
description: Professional Islamic app with Quran, Duas, Books, Ziyaraat, Prayer Times, and Audio Recitation - Available in Urdu, English, and Farsi.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.0
  
  # JSON Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.0
  
  # File picking (for admin upload)
  file_picker: 11.0.2

  # HTTP & File Management
  dio: ^5.3.1
  http: ^1.1.0
  
  # Audio Playing
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_session: ^0.1.16
  
  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  
  # UI & Theme
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  
  # Logging & Debugging
  logger: ^2.0.0
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  flutter_tts: ^4.2.5
  video_player: ^2.11.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.12.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  isar_generator: ^3.1.0+1
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/json/
    - assets/json/quran/
    - assets/json/quran/surahs/
    - assets/json/duas/
    - assets/json/books/
    - assets/json/events/
    - assets/json/ziyaraat/
    - assets/images/
    - assets/images/masoomeen/
    - assets/audio/
    - assets/icons/
    - assets/json/imported/
    - assets/audio/imported/
  
